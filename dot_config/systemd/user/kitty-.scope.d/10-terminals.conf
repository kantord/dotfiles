# kitty puts every window's child into a transient kitty-<pid>-<n>.scope and
# asks for Slice=-.slice. This prefix drop-in applies to all of them and
# overrides that, moving them under terminals.slice (see ../terminals.slice).
# Shell windows are additionally re-scoped per task by
# ~/.local/libexec/kitty-task-scope/zsh; this drop-in is the safety net for
# command windows (e.g. `kitty ... claude`), which sit directly under
# terminals.slice next to the task slices. CPUWeight matches the resting
# weight of those slices so such a window never outranks an inactive task.
#
# Relies on drop-ins beating transient properties. After a kitty or systemd
# upgrade, check: `systemd-cgls --user` must show no kitty-*.scope outside
# terminals.slice.
[Scope]
Slice=terminals.slice
CPUWeight=20
