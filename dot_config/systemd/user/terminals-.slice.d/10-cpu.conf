# Applies to every per-task slice terminals-<task>.slice created by
# ~/.local/libexec/kitty-task-scope/zsh (prefix drop-in).
#
# Two jobs. First, setting any CPU property here makes systemd enable the
# cpu controller inside terminals.slice, so each task is its own scheduling
# group and a 20-thread test suite in one task cannot starve a single agent
# in another. Without this the tasks silently share one flat group.
# Second, 20 is the resting weight: enwiro-daemon raises the task whose
# workspace is focused to 500 ([terminal_priority] in enwiro.toml) and puts
# it back to 20 on the next switch. Keep the two numbers in sync.
[Slice]
CPUWeight=20
